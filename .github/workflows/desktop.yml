name: Desktop release

# Every push to main that carries a releasable Conventional Commit (feat, fix,
# perf, or a breaking change) releases the desktop app:
#
# 1. semantic-release works out the next version from the commits since the
#    last tag, tags it and opens a draft GitHub Release with the notes.
# 2. macOS (universal) and Windows are built at that version and uploaded,
#    with the update metadata, into the draft.
# 3. Once both builds are in, the draft is published, and installed apps
#    update to it.
#
# Pull requests build both platforms without publishing, so a broken build
# shows before it merges. See README, "Desktop app".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Tag and draft the release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the new version
        id: version
        shell: bash
        run: |
          tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)"
          if [ -n "$tag" ]; then
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "Releasing $tag"
          else
            echo "Nothing to release"
          fi

  build:
    name: ${{ matrix.name }}
    needs: release
    # Runs on pull requests (release is skipped there) and when a version was cut.
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
       (needs.release.result == 'success' && needs.release.outputs.version != ''))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            flag: --mac
          - name: Windows
            os: windows-latest
            flag: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use signing certificates when configured
        # electron-builder reads an empty CSC_LINK as a path to the checkout
        # and fails, so only set the variables that have a value. Pull requests
        # never sign.
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set_env() { if [ -n "$2" ]; then echo "$1=$2" >> "$GITHUB_ENV"; fi; }
          if [ "$RUNNER_OS" = macOS ]; then
            set_env CSC_LINK "$MAC_CERTIFICATE"
            set_env CSC_KEY_PASSWORD "$MAC_CERTIFICATE_PASSWORD"
            set_env APPLE_ID "$APPLE_ID"
            set_env APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD"
            set_env APPLE_TEAM_ID "$APPLE_TEAM_ID"
          else
            set_env WIN_CSC_LINK "$WINDOWS_CERTIFICATE"
            set_env WIN_CSC_KEY_PASSWORD "$WINDOWS_CERTIFICATE_PASSWORD"
          fi
      - name: Build unsigned without a macOS certificate
        if: runner.os == 'macOS' && env.CSC_LINK == ''
        shell: bash
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build:desktop
      - name: Package
        if: github.event_name == 'pull_request'
        # Passes a version the same way a release does, so this proves it.
        shell: bash
        run: >-
          npx electron-builder ${{ matrix.flag }} --publish never
          -c.extraMetadata.version=0.0.0-pr.${{ github.event.number }}
      - name: Package and upload to the draft
        if: github.event_name != 'pull_request'
        # The version comes from the tag, so package.json never needs a bump.
        # Bash, because PowerShell splits -c.extraMetadata.version at the dot.
        shell: bash
        run: >-
          npx electron-builder ${{ matrix.flag }} --publish always
          -c.extraMetadata.version=${{ needs.release.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    needs: [release, build]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.release.outputs.version }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" | head -n 1)"
          if [ -z "$id" ]; then echo "::error::No draft release for $TAG"; exit 1; fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=true
